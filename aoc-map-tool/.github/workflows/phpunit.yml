name: Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11.13
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aoc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: aoc_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_READ_HOST: 127.0.0.1
      DB_READ_DATABASE: aoc_test
      DB_READ_USERNAME: root
      DB_READ_PASSWORD: root
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TELESCOPE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, intl, mbstring, zip, curl, tidy, odbc, pdo_odbc, redis
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # /storage is gitignored entirely, so a fresh checkout has none of the
      # framework directories Laravel needs to boot (artisan runs during
      # composer's post-autoload-dump already).
      - name: Create storage skeleton
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build test database
        run: php artisan test:build-db

      - name: Run tests
        run: composer test
